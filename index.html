<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>METAR-touch</title>
<style>
:root{--bg:#0b0e12;--panel:#171b20;--line:#404852;--txt:#f5f7fa;--muted:#9fa8b2;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--txt)}
#app{position:relative;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#viewport{position:absolute;inset:0;overflow:hidden;background:#0d1014}
#world{position:absolute;left:0;top:0;width:1400px;height:800px;transform-origin:0 0;will-change:transform}
#mapimg{position:absolute;inset:0;width:1400px;height:800px;pointer-events:none}
.station{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.72);transform:translate(-50%,-50%);padding:0;z-index:2;box-shadow:0 0 2px rgba(0,0,0,.8)}
.demo{width:8px;height:8px}
.named{width:14px;height:14px;border-width:2px;z-index:4}
.label{position:absolute;display:none;transform:translate(9px,-50%);font-size:12px;font-weight:700;color:white;text-shadow:0 1px 2px #000;white-space:nowrap;z-index:3;pointer-events:none}
#topbar{position:absolute;left:14px;right:14px;top:14px;z-index:20;display:flex;gap:10px;align-items:center;pointer-events:none}
.pill{background:rgba(18,21,25,.90);border:1px solid #3f4750;border-radius:12px;padding:9px 12px;font-size:14px;backdrop-filter:blur(8px)}
#title{font-weight:750;font-size:18px}
#demoBadge{color:#ffcc66}
#controls{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
button.ctrl{min-width:48px;height:46px;border:1px solid #4a535d;background:rgba(24,28,33,.94);color:white;border-radius:12px;font-size:16px;padding:0 14px}
#legend{position:absolute;left:14px;bottom:14px;z-index:20;background:rgba(18,21,25,.90);border:1px solid #3f4750;border-radius:12px;padding:10px 12px;font-size:13px}
#legend span{margin-right:12px;white-space:nowrap} .d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#count{position:absolute;right:14px;bottom:14px;z-index:20;color:#cbd2d9;background:rgba(18,21,25,.90);border:1px solid #3f4750;border-radius:12px;padding:10px 12px;font-size:13px}
#popup{display:none;position:absolute;right:18px;top:78px;z-index:30;width:min(390px,86vw);background:rgba(23,27,32,.98);border:1px solid #555f69;border-radius:16px;padding:18px;box-shadow:0 10px 32px rgba(0,0,0,.48)}
#close{position:absolute;right:10px;top:9px;width:44px;height:44px;border:1px solid #505861;border-radius:50%;background:#23282e;color:white;font-size:26px}
#ptitle{font-size:23px;font-weight:760;padding-right:52px} #pname{color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px;margin-top:15px}
.k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em} .v{font-size:15px;margin-top:2px}
#raw{margin-top:14px;padding-top:12px;border-top:1px solid #343b43;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d5d9dd;word-break:break-word}
@media (max-width:600px){#topbar{right:8px;left:8px}#title{font-size:16px}.pill{padding:8px 9px}#demoBadge{display:none}#legend{font-size:11px;left:8px;bottom:8px}#count{display:none}}
</style>
</head>

const colors={VFR:"#35c759",MVFR:"#0a84ff",IFR:"#ff453a",LIFR:"#bf5af2"};
const world=document.getElementById("world"),vp=document.getElementById("viewport"),popup=document.getElementById("popup");
let scale=1,tx=0,ty=0,pointers=new Map(),pinch=null,dragStart=null,moved=false;

function minScale(){return Math.min(vp.clientWidth/1400,vp.clientHeight/800);}
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;document.querySelectorAll(".label").forEach(e=>e.style.display=scale>1.55?"block":"none");}
function home(){scale=minScale();tx=(vp.clientWidth-1400*scale)/2;ty=(vp.clientHeight-800*scale)/2;apply();}
function zoomAt(f,cx,cy){const ns=Math.max(minScale(),Math.min(scale*f,7));const wx=(cx-tx)/scale,wy=(cy-ty)/scale;tx=cx-wx*ns;ty=cy-wy*ns;scale=ns;apply();}

function addStation(a,kind){
 const b=document.createElement("button");b.type="button";b.className=`station ${kind}`;b.style.left=a.x+"px";b.style.top=a.y+"px";b.style.background=colors[a.cat];b.dataset.id=a.id;
 b.addEventListener("pointerdown",e=>e.stopPropagation());
 b.addEventListener("click",e=>{e.stopPropagation();show(a);});
 world.appendChild(b);
 if(kind==="named"){
   const l=document.createElement("div");l.className="label";l.style.left=a.x+"px";l.style.top=a.y+"px";l.textContent=a.id;world.appendChild(l);
 }
}
demo.forEach(a=>addStation(a,"demo"));named.forEach(a=>addStation(a,"named"));

function show(a){
 popup.style.display="block";
 document.getElementById("ptitle").innerHTML=`${a.id} <span style="color:${colors[a.cat]};font-size:16px">${a.cat}</span>`;
 document.getElementById("pname").textContent=a.name||"Demo reporting station";
 document.getElementById("wind").textContent=a.wind||"Demo";
 document.getElementById("vis").textContent=a.vis||"Demo";
 document.getElementById("ceil").textContent=a.ceil||"Demo";
 document.getElementById("alt").textContent=a.alt||"Demo";
 document.getElementById("temp").textContent=a.temp||"Demo";
 document.getElementById("raw").textContent=a.raw||"Synthetic station used only to test national weather-pattern visualization.";
}
document.getElementById("close").addEventListener("click",()=>popup.style.display="none");
document.getElementById("home").addEventListener("click",home);
document.getElementById("plus").addEventListener("click",()=>zoomAt(1.45,vp.clientWidth/2,vp.clientHeight/2));
document.getElementById("minus").addEventListener("click",()=>zoomAt(1/1.45,vp.clientWidth/2,vp.clientHeight/2));

vp.addEventListener("pointerdown",e=>{
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 vp.setPointerCapture(e.pointerId);moved=false;
 if(pointers.size===1) dragStart={x:e.clientX,y:e.clientY,tx,ty};
 if(pointers.size===2){
   const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
   pinch={d,scale,tx,ty,mx,my};
 }
});
vp.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1&&dragStart){
   moved=true;tx=dragStart.tx+(e.clientX-dragStart.x);ty=dragStart.ty+(e.clientY-dragStart.y);apply();
 } else if(pointers.size===2&&pinch){
   moved=true;const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
   const ns=Math.max(minScale(),Math.min(pinch.scale*(d/pinch.d),7)),wx=(pinch.mx-pinch.tx)/pinch.scale,wy=(pinch.my-pinch.ty)/pinch.scale;
   scale=ns;tx=mx-wx*scale;ty=my-wy*scale;apply();
 }
});
function end(e){pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,tx,ty}}else if(!pointers.size){dragStart=null;pinch=null}}
vp.addEventListener("pointerup",end);vp.addEventListener("pointercancel",end);
vp.addEventListener("dblclick",e=>zoomAt(1.6,e.clientX,e.clientY));
vp.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:0.87,e.clientX,e.clientY)},{passive:false});
window.addEventListener("resize",home);
home();
