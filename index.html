<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>METAR-touch v16.2 — Release 1</title>

<link rel="stylesheet"
href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">

<style>
*{box-sizing:border-box}

html,body,#app,#map{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden
}

body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#0d1014;
 color:#fff
}

#app{position:fixed;inset:0}
#map{position:absolute;inset:0}

#top{
 position:absolute;
 z-index:20;
 top:max(12px,env(safe-area-inset-top));
 left:12px;
 right:12px;
 display:flex;
 gap:8px;
 align-items:center;
 pointer-events:none
}

.pill{
 background:rgba(15,18,22,.94);
 border:1px solid #44505c;
 border-radius:12px;
 padding:9px 12px;
 backdrop-filter:blur(9px)
}
