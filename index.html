const all=[...demo,...named], colors={VFR:"#35c759",MVFR:"#0a84ff",IFR:"#ff453a",LIFR:"#bf5af2"};
const vp=document.getElementById("viewport"),stage=document.getElementById("stage"),scene=document.getElementById("scene"),sg=document.getElementById("stations"),popup=document.getElementById("popup");
let scale=1,tx=0,ty=0,pointers=new Map(),gesture=null,tapStart=null;
const NS="http://www.w3.org/2000/svg";

function buildStations(){
 for(const a of demo){
  const c=document.createElementNS(NS,"circle"); c.setAttribute("cx",a.x);c.setAttribute("cy",a.y);c.setAttribute("r","4.3");c.setAttribute("fill",colors[a.cat]);sg.appendChild(c);
 }
 for(const a of named){
  const c=document.createElementNS(NS,"circle");c.setAttribute("class","named");c.setAttribute("cx",a.x);c.setAttribute("cy",a.y);c.setAttribute("r","7");c.setAttribute("fill",colors[a.cat]);sg.appendChild(c);
  const t=document.createElementNS(NS,"text");t.setAttribute("x",a.x+10);t.setAttribute("y",a.y+4);t.textContent=a.id;sg.appendChild(t);
 }
}
buildStations();

function fitScale(){return Math.min(vp.clientWidth/1400,vp.clientHeight/800);}
function minScale(){return fitScale()*0.55}
function updateStage(){stage.setAttribute("viewBox",`0 0 ${vp.clientWidth} ${vp.clientHeight}`);}
function apply(){
 scene.setAttribute("transform",`translate(${tx} ${ty}) scale(${scale})`);
 const z=scale/fitScale();
 document.querySelectorAll("#stations text").forEach(t=>t.style.display=z>1.8?"block":"none");
}
function home(){
 updateStage();scale=fitScale();tx=(vp.clientWidth-1400*scale)/2;ty=(vp.clientHeight-800*scale)/2;apply();
}
function clamp(){
 const mw=1400*scale,mh=800*scale,pad=120;
 tx=mw<=vp.clientWidth?(vp.clientWidth-mw)/2:Math.min(pad,Math.max(vp.clientWidth-mw-pad,tx));
 ty=mh<=vp.clientHeight?(vp.clientHeight-mh)/2:Math.min(pad,Math.max(vp.clientHeight-mh-pad,ty));
}
function zoomAt(f,cx,cy){
 const ns=Math.max(minScale(),Math.min(scale*f,fitScale()*9));
 const wx=(cx-tx)/scale,wy=(cy-ty)/scale;tx=cx-wx*ns;ty=cy-wy*ns;scale=ns;clamp();apply();
}
function nearest(cx,cy){
 const x=(cx-tx)/scale,y=(cy-ty)/scale,hit=24/scale;let b=null,bd=Infinity;
 for(const a of all){const dx=a.x-x,dy=a.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=a}}
 return bd<=hit*hit?b:null;
}
function show(a){
 popup.style.display="block";
 document.getElementById("ptitle").innerHTML=`${a.id} <span style="color:${colors[a.cat]};font-size:16px">${a.cat}</span>`;
 document.getElementById("pname").textContent=a.name||"Demo reporting station";
 document.getElementById("wind").textContent=a.wind||"Demo";document.getElementById("vis").textContent=a.vis||"Demo";
 document.getElementById("ceil").textContent=a.ceil||"Demo";document.getElementById("alt").textContent=a.alt||"Demo";
 document.getElementById("temp").textContent=a.temp||"Demo";document.getElementById("raw").textContent=a.raw||"Synthetic station used to test national weather-pattern visualization.";
}
document.getElementById("close").onclick=()=>popup.style.display="none";
document.getElementById("home").onclick=home;
document.getElementById("plus").onclick=()=>zoomAt(1.45,vp.clientWidth/2,vp.clientHeight/2);
document.getElementById("minus").onclick=()=>zoomAt(.72,vp.clientWidth/2,vp.clientHeight/2);

vp.addEventListener("pointerdown",e=>{
 vp.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){gesture={mode:"pan",x:e.clientX,y:e.clientY,tx,ty};tapStart={x:e.clientX,y:e.clientY,t:performance.now()}}
 else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;gesture={mode:"pinch",d,s:scale,tx,ty,mx,my};tapStart=null}
});
vp.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1&&gesture?.mode==="pan"){tx=gesture.tx+(e.clientX-gesture.x);ty=gesture.ty+(e.clientY-gesture.y);clamp();apply()}
 else if(pointers.size===2&&gesture?.mode==="pinch"){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
  const ns=Math.max(minScale(),Math.min(gesture.s*d/gesture.d,fitScale()*9)),wx=(gesture.mx-gesture.tx)/gesture.s,wy=(gesture.my-gesture.ty)/gesture.s;
  scale=ns;tx=mx-wx*scale;ty=my-wy*scale;clamp();apply()}
});
function finish(e){
 const wasTap=tapStart&&pointers.size===1&&performance.now()-tapStart.t<500&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)<8;
 pointers.delete(e.pointerId);
 if(wasTap){const a=nearest(e.clientX,e.clientY);if(a)show(a);else popup.style.display="none"}
 if(pointers.size===1){const p=[...pointers.values()][0];gesture={mode:"pan",x:p.x,y:p.y,tx,ty}}
 else if(!pointers.size){gesture=null;tapStart=null;clamp();apply()}
}
vp.addEventListener("pointerup",finish);vp.addEventListener("pointercancel",finish);
vp.addEventListener("dblclick",e=>zoomAt(1.55,e.clientX,e.clientY));
vp.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.14:.88,e.clientX,e.clientY)},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
window.addEventListener("resize",home);home();
