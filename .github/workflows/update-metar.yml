name: Update METAR snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download current METAR cache
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "https://aviationweather.gov/data/cache/metars.cache.csv.gz" \
            -o metars.cache.csv.gz

      - name: Update METAR snapshot
        run: python scripts/update_metar.py

      - name: Commit updated METAR snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metars_snapshot.json
          if git diff --cached --quiet; then
            echo "No METAR snapshot changes."
            exit 0
          fi
          git commit -m "Update METAR snapshot"
          git push
