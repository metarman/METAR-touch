name: Build aviation snapshots

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download current METAR cache
        run: |
          curl -fL \
            "https://aviationweather.gov/data/cache/metars.cache.csv.gz" \
            -o metars.cache.csv.gz

      - name: Update METAR snapshot
        run: python scripts/update_metar.py

      - name: Update FAA airspace snapshot
        run: python scripts/update_airspace.py

      - name: Update FAA airport snapshot
        run: python scripts/update_airports.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metars_snapshot.json airspace_snapshot.json airports_snapshot.json

          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git commit -m "Update aviation snapshots"
          git push
